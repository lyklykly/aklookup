<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>정답 사전 · Answer Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --case:#2B2E33;
    --case-deep:#1B1D21;
    --case-trim:#383C42;
    --case-trim-2:#43474e;
    --screen-bg:#E4EAE6;
    --screen-bg-2:#DCE4DF;
    --screen-ink:#1E3226;
    --screen-ink-soft:#4B6156;
    --brass:#C9A227;
    --brass-soft:#8f7a3f;
    --paper:#EFEBE1;
    --tab-reading:#C6553F;
    --tab-vocaa:#3E72A6;
    --tab-vocag:#4B8F5B;
    --tab-nonfic:#8C6FAE;
    --tab-math:#2F8F9D;
    --circle:#C8237A;
    --danger:#B23B3B;
    --radius-case:22px;
    --radius-screen:10px;
    --font-ui:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #3a3f46 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #23262b 0%, transparent 50%),
      #1b1d21;
    font-family:var(--font-ui);
    color:var(--paper);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 14px 60px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{ width:100%; max-width:860px; }

  .brandline{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 6px 14px; color:#8d9199; font-size:12px; letter-spacing:.08em;
  }
  .brandline b{ color:#c7cbd1; font-weight:600; }

  /* ===== device shell ===== */
  .device{
    background:linear-gradient(180deg, var(--case-trim), var(--case) 8%, var(--case) 92%, var(--case-deep));
    border-radius:var(--radius-case);
    padding:18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 30px 60px -25px rgba(0,0,0,.7),
      0 10px 20px -12px rgba(0,0,0,.5);
    position:relative;
  }
  .device::before{ /* top hinge/speaker deco */
    content:"";
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:64px; height:5px; border-radius:3px;
    background:repeating-linear-gradient(90deg, #17181b 0 4px, transparent 4px 8px);
    opacity:.55;
  }

  .plate{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 10px 16px;
  }
  .plate .title{
    font-weight:700; font-size:15px; letter-spacing:.02em; color:#eef0f2;
    display:flex; align-items:center; gap:8px;
  }
  .plate .title .led{
    width:7px; height:7px; border-radius:50%;
    background:#7ee787; box-shadow:0 0 6px 1px #7ee78799;
    animation:blink 3.2s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .plate .model{ font-family:var(--font-mono); font-size:10.5px; color:#8d9199; letter-spacing:.06em; }

  /* ===== body: tabs + panel ===== */
  .body-row{ display:flex; gap:0; align-items:stretch; }

  .tabs{
    display:flex; flex-direction:column; gap:10px;
    padding:4px 0 4px 4px;
    width:96px; flex:0 0 auto;
  }
  .tab{
    position:relative;
    border:none; cursor:pointer;
    padding:14px 10px 14px 14px;
    border-radius:10px 0 0 10px;
    font-family:var(--font-ui);
    font-weight:600; font-size:12.5px; line-height:1.35; text-align:left;
    color:#eef0f2;
    background:var(--case-trim);
    opacity:.72;
    transform:translateX(0);
    transition:transform .16s ease, opacity .16s ease, box-shadow .16s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  }
  .tab .dot{
    display:inline-block; width:8px; height:8px; border-radius:2px; margin-bottom:6px;
  }
  .tab[data-book="reading"] .dot{ background:var(--tab-reading); }
  .tab[data-book="vocaa"] .dot{ background:var(--tab-vocaa); }
  .tab[data-book="vocag"] .dot{ background:var(--tab-vocag); }
  .tab[data-book="nonfic"] .dot{ background:var(--tab-nonfic); }
  .tab[data-book="math"] .dot{ background:var(--tab-math); }
  .tab small{ display:block; font-family:var(--font-mono); font-weight:400; font-size:10px; color:#a9adb4; margin-top:3px; }
  .tab:hover{ opacity:.9; }
  .tab.active{
    opacity:1;
    background:var(--screen-bg);
    color:var(--screen-ink);
    transform:translateX(6px);
    box-shadow:-2px 0 12px -4px rgba(0,0,0,.5);
  }
  .tab.active small{ color:var(--screen-ink-soft); }
  .tab.active[data-book="reading"]{ border-left:4px solid var(--tab-reading); }
  .tab.active[data-book="vocaa"]{ border-left:4px solid var(--tab-vocaa); }
  .tab.active[data-book="vocag"]{ border-left:4px solid var(--tab-vocag); }
  .tab.active[data-book="nonfic"]{ border-left:4px solid var(--tab-nonfic); }
  .tab.active[data-book="math"]{ border-left:4px solid var(--tab-math); }

  .panel{
    flex:1 1 auto; min-width:0;
    background:var(--case-trim);
    border-radius:12px;
    padding:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  }

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;
  }
  .field{ display:flex; flex-direction:column; gap:5px; flex:1 1 130px; }
  .field label{ font-size:11px; color:#a9adb4; letter-spacing:.03em; }
  select, input[type=number], input[type=text]{
    font-family:var(--font-ui);
    font-size:14px; font-weight:500;
    color:#eef0f2;
    background:var(--case-deep);
    border:1px solid #4a4f57;
    border-radius:8px;
    padding:10px 10px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%23a9adb4'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
    padding-right:28px;
  }
  select:focus, input:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(201,162,39,.18); }
  input::placeholder{ color:#767a81; }

  .field.qnum{ flex:0 1 108px; }

  /* ===== screen ===== */
  .screen{
    background:linear-gradient(180deg, var(--screen-bg), var(--screen-bg-2));
    border-radius:var(--radius-screen);
    padding:20px 20px 18px;
    min-height:168px;
    position:relative;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.18),
      inset 0 0 0 6px #1b1d21,
      inset 0 0 0 8px #454a52;
    color:var(--screen-ink);
    overflow:hidden;
  }
  .screen::after{ /* subtle scanline sheen */
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.025) 0 2px, transparent 2px 4px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:var(--font-mono); font-size:11.5px; font-weight:600;
    letter-spacing:.09em; color:var(--screen-ink-soft);
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .eyebrow .path{ text-transform:uppercase; flex:1 1 auto; min-width:0; overflow-wrap:break-word; margin-right:10px; }
  .copy-btn{ flex:0 0 auto; }
  .copy-btn{
    font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    color:var(--screen-ink-soft); background:transparent; border:1px solid var(--screen-ink-soft);
    border-radius:5px; padding:3px 8px; cursor:pointer; opacity:.75;
    transition:opacity .12s ease, color .12s ease, border-color .12s ease;
  }
  .copy-btn:hover{ opacity:1; color:var(--screen-ink); border-color:var(--screen-ink); }
  .copy-btn.copied{ opacity:1; color:#1f6b3a; border-color:#1f6b3a; }

  .answer-grid{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px;
  }
  .answer-cell{
    font-family:var(--font-mono);
    background:rgba(30,50,38,.06);
    border:1px solid rgba(30,50,38,.16);
    border-radius:8px;
    padding:10px 14px;
    min-width:56px;
    text-align:center;
  }
  .answer-cell .q{ font-size:10.5px; opacity:.62; margin-bottom:3px; }
  .answer-cell .a{ font-size:22px; font-weight:700; letter-spacing:.02em; }

  .answer-list{ display:flex; flex-direction:column; gap:2px; }
  .answer-list .row{
    display:flex; gap:10px; align-items:baseline;
    font-family:var(--font-mono); font-size:15px;
    padding:6px 2px; border-bottom:1px dashed rgba(30,50,38,.15);
  }
  .answer-list .row:last-child{ border-bottom:none; }
  .answer-list .row .n{ opacity:.55; min-width:26px; }
  .answer-list .row .v{ font-weight:600; word-break:break-word; }

  .single-answer{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .single-answer .big{ font-family:var(--font-mono); font-size:30px; font-weight:700; }
  .single-answer .tag{ font-family:var(--font-mono); font-size:12px; color:var(--screen-ink-soft); }

  .sample-text{
    margin-top:14px; padding-top:12px; border-top:1px solid rgba(30,50,38,.16);
    font-family:var(--font-mono); font-size:12.5px; line-height:1.6; color:var(--screen-ink-soft);
  }
  .sample-text .lbl{ font-weight:700; color:var(--screen-ink); margin-right:6px; }


  /* ===== Spectrum Math answers ===== */
  .math-body{ display:flex; flex-direction:column; }
  .math-body > *{ border-bottom:1px dashed rgba(30,50,38,.15); }
  .math-body > *:last-child{ border-bottom:none; }
  .num-grid-wrap{ overflow-x:auto; padding:2px 0 4px; }
  .num-grid{ border-collapse:collapse; font-family:var(--font-mono); font-size:15px; font-weight:600; }
  .num-grid td{ padding:6px .9em 6px 0; text-align:right; white-space:nowrap; }
  .num-grid td::after{ content:","; opacity:.35; font-weight:400; }
  .num-grid td:last-child::after{ content:""; }
  .num-grid tr + tr td{ border-top:1px dashed rgba(30,50,38,.12); }
  .math-line{ font-family:var(--font-mono); font-size:15px; font-weight:600; line-height:1.6; padding:7px 2px; overflow-wrap:break-word; }
  .math-line.note{ font-family:var(--font-ui); font-size:13px; font-weight:500; line-height:1.5; color:var(--screen-ink-soft); }
  .math-line .nowrap{ white-space:nowrap; }
  .circled{ display:inline-block; border:2px solid var(--circle); border-radius:999px; padding:0 .38em; line-height:1.2; margin:0 .04em; }
  .frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-size:.76em; line-height:1.08; margin:0 .1em; }
  .frac .num{ border-bottom:1.5px solid currentColor; padding:0 .18em; }
  .ans-figure{ padding:10px 0 8px; }
  .ans-figure img{ display:block; max-width:100%; height:auto; mix-blend-mode:multiply; }
  .ans-img-inline{ height:2.4em; width:auto; vertical-align:middle; mix-blend-mode:multiply; }
  .math-legend{ margin-top:12px; font-family:var(--font-ui); font-size:11.5px; color:var(--screen-ink-soft); display:flex; align-items:center; gap:6px; }
  .math-legend .circled{ width:1.2em; height:1.2em; padding:0; }

  .empty-msg, .error-msg{
    font-family:var(--font-mono); font-size:13.5px; color:var(--screen-ink-soft); line-height:1.7;
  }
  .error-msg{ color:var(--danger); }

  /* recent */
  .recent{ margin-top:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .recent .lbl{ font-family:var(--font-mono); font-size:10.5px; color:#8d9199; }
  .chip{
    font-family:var(--font-mono); font-size:11px; color:#c7cbd1;
    background:var(--case-deep); border:1px solid #4a4f57; border-radius:20px;
    padding:5px 11px; cursor:pointer;
  }
  .chip:hover{ border-color:var(--brass); color:#eef0f2; }

  .foot{
    text-align:center; color:#6b6f76; font-size:11px; margin-top:16px; letter-spacing:.02em;
  }

  /* mobile */
  @media (max-width: 620px){
    .body-row{ flex-direction:column; }
    .tabs{ display:grid; grid-template-columns:repeat(3, 1fr); width:auto; padding:0; gap:8px; }
    .tab{ border-radius:10px; flex:1 1 0; text-align:center; padding:10px 6px; }
    .tab .dot{ margin:0 auto 6px; }
    .tab.active{ transform:translateY(-3px); }
    .tab.active[data-book="reading"]{ border-left:none; border-bottom:4px solid var(--tab-reading); }
    .tab.active[data-book="vocaa"]{ border-left:none; border-bottom:4px solid var(--tab-vocaa); }
    .tab.active[data-book="vocag"]{ border-left:none; border-bottom:4px solid var(--tab-vocag); }
    .tab.active[data-book="nonfic"]{ border-left:none; border-bottom:4px solid var(--tab-nonfic); }
    .tab.active[data-book="math"]{ border-left:none; border-bottom:4px solid var(--tab-math); }
    .screen{ padding:16px 14px 14px; }
    .num-grid td{ padding-right:.6em; }
    .panel{ margin-top:8px; }
    .answer-cell{ min-width:64px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandline"><span><b>정답 사전</b> · Answer Finder</span><span>ELECTRONIC LOOKUP</span></div>

  <div class="device">
    <div class="plate">
      <div class="title"><span class="led"></span>ANSWER FINDER</div>
      <div class="model">MODEL AF-3 · 5 BOOKS LOADED</div>
    </div>

    <div class="body-row">
      <div class="tabs">
        <button class="tab" data-book="reading"><span class="dot"></span>정호 리딩<small>WEEK / DAY</small></button>
        <button class="tab" data-book="vocaa"><span class="dot"></span>Voca A<small>UNIT / TYPE</small></button>
        <button class="tab" data-book="vocag"><span class="dot"></span>Voca Green<small>UNIT / TYPE</small></button>
        <button class="tab" data-book="nonfic"><span class="dot"></span>Nonfiction G2<small>PAGE</small></button>
        <button class="tab" data-book="math"><span class="dot"></span>Spectrum Math G2<small>PAGE</small></button>
      </div>

      <div class="panel">
        <div class="controls" id="controls"></div>
        <div class="screen" id="screen">
          <div class="eyebrow"><span class="path" id="eyebrow-path">책을 선택하세요</span><button class="copy-btn" id="copyBtn" style="display:none;">복사</button></div>
          <div id="screen-body"></div>
        </div>
        <div class="recent" id="recent" style="display:none;">
          <span class="lbl">최근 조회</span>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">Daily Reading Comprehension (EMC 3454) · Vocabulary Workshop Level A · Vocabulary Workshop Level Green · Nonfiction Reading Practice Grade 2 (EMC 3313) · Spectrum Math Grade 2 — 제공된 정답지 기반</div>
</div>

/* ===================== app logic ===================== */
const BOOK_META = {
  reading: { label: '정호 리딩', accent: '#C6553F' },
  vocaa:   { label: 'Voca Workshop A', accent: '#3E72A6' },
  vocag:   { label: 'Voca Workshop Green', accent: '#4B8F5B' },
  nonfic:  { label: 'Nonfiction Reading Practice G2', accent: '#8C6FAE' },
  math:    { label: 'Spectrum Math G2', accent: '#2F8F9D' },
};

let state = {
  book: null,
  week: null, day: null,
  unit: null, cat: null, qnum: '',
  page: null,
  mpage: null,
};
let recentList = []; // {label, apply()}

const controlsEl = document.getElementById('controls');
const screenBodyEl = document.getElementById('screen-body');
const eyebrowPathEl = document.getElementById('eyebrow-path');
const copyBtnEl = document.getElementById('copyBtn');
const recentEl = document.getElementById('recent');
let lastCopyText = '';

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'text') e.textContent = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if(children) children.forEach(c => c && e.appendChild(c));
  return e;
}

function selectEl(id, label, options, value, onChange){
  const wrap = el('div', {class:'field'});
  wrap.appendChild(el('label', {for:id, text:label}));
  const sel = el('select', {id});
  options.forEach(opt => {
    const o = el('option', {value: opt.value, text: opt.label});
    if(opt.value === value) o.setAttribute('selected','selected');
    sel.appendChild(o);
  });
  sel.addEventListener('change', e => onChange(e.target.value));
  wrap.appendChild(sel);
  return wrap;
}

function numberInputEl(id, label, value, placeholder, onChange){
  const wrap = el('div', {class:'field qnum'});
  wrap.appendChild(el('label', {for:id, text:label}));
  const inp = el('input', {id, type:'number', min:'1', placeholder: placeholder || '전체'});
  if(value) inp.value = value;
  inp.addEventListener('input', e => onChange(e.target.value));
  wrap.appendChild(inp);
  return wrap;
}

/* ---------- tab switching ---------- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => setBook(btn.dataset.book));
});

function setBook(book){
  state.book = book;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.book === book));
  if(book === 'reading'){
    if(state.week == null) state.week = 1;
    if(state.day == null) state.day = 1;
  } else if(book === 'nonfic'){
    if(state.page == null) state.page = Object.keys(NONFIC_DATA).map(Number).sort((a,b)=>a-b)[0];
  } else if(book === 'math'){
    if(state.mpage == null) state.mpage = Object.keys(SM_DATA).map(Number).sort((a,b)=>a-b)[0];
  } else {
    const data = book === 'vocaa' ? LEVELA_DATA : GREEN_DATA;
    const units = Object.keys(data);
    state.unit = units[0];
    const cats = Object.keys(data[state.unit]);
    state.cat = cats[0];
    state.qnum = '';
  }
  renderControls();
  renderScreen();
}

/* ---------- render controls per book ---------- */
function renderControls(){
  controlsEl.innerHTML = '';
  if(state.book === 'reading'){
    const weekOpts = Array.from({length:30}, (_,i)=>({value:String(i+1), label:'WEEK '+(i+1)}));
    const dayOpts = Array.from({length:5}, (_,i)=>({value:String(i+1), label:'DAY '+(i+1)}));
    controlsEl.appendChild(selectEl('sel-week','주차 (Week)', weekOpts, String(state.week), v=>{ state.week = Number(v); renderScreen(); }));
    controlsEl.appendChild(selectEl('sel-day','일차 (Day)', dayOpts, String(state.day), v=>{ state.day = Number(v); renderScreen(); }));
  } else if(state.book === 'nonfic'){
    const pageNums = Object.keys(NONFIC_DATA).map(Number).sort((a,b)=>a-b);
    const pageOpts = pageNums.map(p => ({value:String(p), label:'PAGE '+p}));
    controlsEl.appendChild(selectEl('sel-page','페이지 (Page)', pageOpts, String(state.page), v=>{ state.page = Number(v); renderScreen(); }));
  } else if(state.book === 'math'){
    const pageNums = Object.keys(SM_DATA).map(Number).sort((a,b)=>a-b);
    const pageOpts = pageNums.map(p => ({value:String(p), label:'PAGE '+p}));
    controlsEl.appendChild(selectEl('sel-mpage','페이지 (Page)', pageOpts, String(state.mpage), v=>{ state.mpage = Number(v); renderScreen(); }));
  } else {
    const data = state.book === 'vocaa' ? LEVELA_DATA : GREEN_DATA;
    const unitOpts = Object.keys(data).map(u => ({value:u, label:u}));
    controlsEl.appendChild(selectEl('sel-unit','유닛 (Unit)', unitOpts, state.unit, v=>{
      state.unit = v;
      const cats = Object.keys(data[state.unit]);
      state.cat = cats[0];
      state.qnum = '';
      renderControls();
      renderScreen();
    }));
    const catOpts = Object.keys(data[state.unit]).map(c => ({value:c, label:c}));
    controlsEl.appendChild(selectEl('sel-cat','유형 (Category)', catOpts, state.cat, v=>{ state.cat = v; renderScreen(); }));
    controlsEl.appendChild(numberInputEl('inp-qnum','문제 번호', state.qnum, '전체보기', v=>{ state.qnum = v; renderScreen(); }));
  }
}

/* ---------- render screen ---------- */
function renderScreen(){
  screenBodyEl.innerHTML = '';
  copyBtnEl.style.display = 'none';

  if(state.book === 'reading'){
    eyebrowPathEl.textContent = `WEEK ${pad2(state.week)} · DAY ${state.day}`;
    const entry = (WEEK_DATA[String(state.week)] || {})[String(state.day)];
    if(!entry){
      screenBodyEl.appendChild(el('div',{class:'empty-msg', text:'데이터를 찾을 수 없어요.'}));
      return;
    }
    const grid = el('div',{class:'answer-grid'});
    const order = ['1','2','3','4'];
    const copyParts = [];
    order.forEach(n => {
      const letter = entry.answers[n];
      if(!letter) return;
      copyParts.push(n+'.'+letter);
      grid.appendChild(el('div',{class:'answer-cell'}, [
        el('div',{class:'q', text:'Q'+n}),
        el('div',{class:'a', text:letter}),
      ]));
    });
    screenBodyEl.appendChild(grid);
    if(entry.text){
      screenBodyEl.appendChild(el('div',{class:'sample-text'}, [
        el('span',{class:'lbl', text:'예시 답안'}),
        document.createTextNode(entry.text)
      ]));
    }
    lastCopyText = `WEEK ${state.week} DAY ${state.day}  ` + copyParts.join('  ');
    copyBtnEl.style.display = copyParts.length ? '' : 'none';
    { const w = state.week, d = state.day;
      addRecent(`W${w}·D${d}`, () => { state.week = w; state.day = d; setBook('reading'); }); }

  } else if(state.book === 'nonfic'){
    eyebrowPathEl.textContent = `PAGE ${state.page}`;
    const entry = NONFIC_DATA[String(state.page)];
    if(!entry){
      screenBodyEl.appendChild(el('div',{class:'empty-msg', text:'데이터를 찾을 수 없어요.'}));
      return;
    }
    const grid = el('div',{class:'answer-grid'});
    const order = ['1','2','3','4','5'];
    const copyParts = [];
    order.forEach(n => {
      const letter = entry.answers[n];
      if(!letter) return;
      copyParts.push(n+'.'+letter);
      grid.appendChild(el('div',{class:'answer-cell'}, [
        el('div',{class:'q', text:'Q'+n}),
        el('div',{class:'a', text:letter}),
      ]));
    });
    screenBodyEl.appendChild(grid);
    let bonusFormatted = '';
    if(entry.bonus){
      bonusFormatted = formatBonus(entry.bonus);
      screenBodyEl.appendChild(el('div',{class:'sample-text'}, [
        el('span',{class:'lbl', text:'보너스'}),
        document.createTextNode(bonusFormatted)
      ]));
    }
    lastCopyText = copyParts.join('/ ') + (bonusFormatted ? `/ Bonus: ${bonusFormatted}` : '');
    copyBtnEl.style.display = copyParts.length ? '' : 'none';
    { const p = state.page;
      addRecent(`P${p}`, () => { state.page = p; setBook('nonfic'); }); }

  } else if(state.book === 'math'){
    eyebrowPathEl.textContent = `PAGE ${state.mpage}`;
    const lines = SM_DATA[String(state.mpage)];
    if(!lines){
      screenBodyEl.appendChild(el('div',{class:'empty-msg', text:'데이터를 찾을 수 없어요.'}));
      return;
    }
    screenBodyEl.appendChild(renderMathLines(lines));
    fitGrids();
    if(lines.some(l => l.indexOf('[[') !== -1)){
      screenBodyEl.appendChild(el('div',{class:'math-legend'}, [
        el('span',{class:'circled'}), document.createTextNode('정답지에서 동그라미 친 답')
      ]));
    }
    lastCopyText = `PAGE ${state.mpage}\n` + lines.map(plainMathLine).join('\n');
    copyBtnEl.style.display = '';
    { const p = state.mpage;
      addRecent(`Math p${p}`, () => { state.mpage = p; setBook('math'); }); }

  } else {
    const data = state.book === 'vocaa' ? LEVELA_DATA : GREEN_DATA;
    eyebrowPathEl.textContent = `${state.unit} · ${state.cat}`;
    const catData = ((data[state.unit] || {})[state.cat]) || {};
    const keys = Object.keys(catData).map(Number).sort((a,b)=>a-b);

    if(state.qnum !== '' && state.qnum != null){
      const qn = Number(state.qnum);
      if(catData.hasOwnProperty(String(qn))){
        const ans = catData[String(qn)];
        screenBodyEl.appendChild(el('div',{class:'single-answer'}, [
          el('div',{class:'big', text: ans}),
          el('div',{class:'tag', text: 'Q'+qn}),
        ]));
        lastCopyText = `${state.unit} ${state.cat} Q${qn}: ${ans}`;
        copyBtnEl.style.display = '';
        { const b = state.book, u = state.unit, c = state.cat;
          addRecent(`${shortUnit(u)}·${shortCat(c)}·Q${qn}`, () => { setBook(b); state.unit = u; state.cat = c; state.qnum = String(qn); renderControls(); renderScreen(); }); }
      } else {
        const range = keys.length ? `${keys[0]}~${keys[keys.length-1]}번` : '없음';
        screenBodyEl.appendChild(el('div',{class:'error-msg'}, [
          document.createTextNode(`이 유형에는 ${qn}번 문제가 없어요.`),
          el('br'), document.createTextNode(`사용 가능한 번호: ${range}`)
        ]));
        copyBtnEl.style.display = 'none';
      }
    } else {
      if(!keys.length){
        screenBodyEl.appendChild(el('div',{class:'empty-msg', text:'이 유형에는 등록된 정답이 없어요.'}));
        return;
      }
      const list = el('div',{class:'answer-list'});
      const copyParts = [];
      keys.forEach(n => {
        const v = catData[String(n)];
        copyParts.push(`${n}. ${v}`);
        list.appendChild(el('div',{class:'row'}, [
          el('span',{class:'n', text:n+'.'}),
          el('span',{class:'v', text:v}),
        ]));
      });
      screenBodyEl.appendChild(list);
      lastCopyText = `${state.unit} ${state.cat}\n` + copyParts.join(' / ');
      copyBtnEl.style.display = '';
      { const b = state.book, u = state.unit, c = state.cat;
        addRecent(`${shortUnit(u)}·${shortCat(c)}`, () => { setBook(b); state.unit = u; state.cat = c; state.qnum = ''; renderControls(); renderScreen(); }); }
    }
  }
}

function pad2(n){ return String(n).padStart(2,'0'); }
function shortUnit(u){ return u.replace('Units ','U').replace('Unit ','U'); }
function shortCat(c){ return c.length > 10 ? c.slice(0,9)+'…' : c; }

function formatBonus(text){
  if(!text) return '';
  // strip a generic "Answers will vary ... :" lead-in, keeping the actual example content
  let t = text.replace(/^Answers will vary[^:]*:\s*/, '');
  // split into sentences (no lookbehind, for older Safari compatibility) and join with " / "
  let parts = t.replace(/([.!?]['"]?)\s+/g, '$1|||').split('|||').map(s => s.trim()).filter(Boolean);
  return parts.join(' / ');
}

/* ---------- Spectrum Math helpers ----------
   Markup in SM_DATA: [[x]] circled answer · {f:a/b} fraction · {img:key} graphic from the key */
const NUM_TOKEN = /^(\d{1,3}(,\d{3})+|\d+)$/;
function listTokens(line){
  if(/[\[{]/.test(line)) return null;
  const toks = line.split(/[;,]\s+/).map(t => t.trim());
  if(toks.length < 3) return null;
  return toks.every(t => NUM_TOKEN.test(t)) ? toks : null;
}
function richInline(text){
  const frag = document.createDocumentFragment();
  const re = /\[\[(.+?)\]\]|\{f:(\d+)\/(\d+)\}|\{img:([a-z0-9]+)\}/g;
  let last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    if(m[1] !== undefined){
      frag.appendChild(el('span',{class:'circled', text:m[1]}));
    } else if(m[2] !== undefined){
      frag.appendChild(el('span',{class:'frac'}, [el('span',{class:'num', text:m[2]}), el('span',{class:'den', text:m[3]})]));
    } else if(m[4] !== undefined && SM_IMG[m[4]]){
      frag.appendChild(el('img',{class:'ans-img-inline', src:SM_IMG[m[4]].src, alt:'정답 그림'}));
    }
    last = re.lastIndex;
  }
  if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
function renderMathLines(lines){
  const body = el('div',{class:'math-body'});
  let grid = null;
  lines.forEach(line => {
    const toks = listTokens(line);
    if(toks){
      if(!grid){ grid = el('table',{class:'num-grid'}); body.appendChild(el('div',{class:'num-grid-wrap'}, [grid])); }
      const tr = el('tr');
      toks.forEach(t => tr.appendChild(el('td',{text:t})));
      grid.appendChild(tr);
      return;
    }
    grid = null;
    const only = line.match(/^\{img:([a-z0-9]+)\}$/);
    if(only){
      const im = SM_IMG[only[1]];
      if(im) body.appendChild(el('div',{class:'ans-figure'}, [
        el('img',{src:im.src, alt:'정답 그림', style:`width:${Math.round(im.w*0.8)}px`})
      ]));
      return;
    }
    const isNote = /^(Check student|Answers may vary)/.test(line);
    const row = el('div',{class: isNote ? 'math-line note' : 'math-line'});
    const segs = line.split(/;\s+/);
    segs.forEach((s, i) => {
      const span = el('span',{class: s.length <= 24 ? 'seg nowrap' : 'seg'});
      span.appendChild(richInline(s));
      row.appendChild(span);
      if(i < segs.length - 1) row.appendChild(document.createTextNode('; '));
    });
    body.appendChild(row);
  });
  return body;
}
/* shrink a number grid until every column fits on screen (phones) */
function fitGrids(){
  document.querySelectorAll('.num-grid-wrap').forEach(w => {
    const t = w.firstChild;
    t.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(t).fontSize);
    while(w.scrollWidth > w.clientWidth + 1 && fs > 10.5){ fs -= 0.5; t.style.fontSize = fs + 'px'; }
  });
}
window.addEventListener('resize', () => { if(state.book === 'math') fitGrids(); });
function plainMathLine(l){
  if(/^\{img:[^}]+\}$/.test(l)) return '(그림 — 화면 참고)';
  return l.replace(/\[\[(.+?)\]\]/g, '$1').replace(/\{f:(\d+)\/(\d+)\}/g, '$1/$2').replace(/\{img:[^}]+\}/g, '(그림)');
}

/* ---------- recent chips ---------- */
function addRecent(label, applyFn){
  recentList = recentList.filter(r => r.label !== label);
  recentList.unshift({label, applyFn});
  recentList = recentList.slice(0, 8);
  renderRecent();
}
function renderRecent(){
  recentEl.querySelectorAll('.chip').forEach(c => c.remove());
  if(!recentList.length){ recentEl.style.display = 'none'; return; }
  recentEl.style.display = 'flex';
  recentList.forEach(r => {
    const chip = el('button',{class:'chip', text:r.label});
    chip.addEventListener('click', r.applyFn);
    recentEl.appendChild(chip);
  });
}

/* ---------- copy ---------- */
copyBtnEl.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(lastCopyText);
    copyBtnEl.textContent = '복사됨';
    copyBtnEl.classList.add('copied');
    setTimeout(()=>{ copyBtnEl.textContent = '복사'; copyBtnEl.classList.remove('copied'); }, 1400);
  }catch(e){
    copyBtnEl.textContent = '복사 실패';
    setTimeout(()=>{ copyBtnEl.textContent = '복사'; }, 1400);
  }
});

/* ---------- init ---------- */
setBook('reading');
</script>
